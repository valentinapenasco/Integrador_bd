services:
  db:
    image: postgres:15
    container_name: bodegas_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bodegas_atuel
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bodegas_atuel"]
      interval: 5s
      timeout: 5s
      retries: 12

  db-bootstrap:
    image: postgres:15
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: postgres
      DB_API_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - ./api/sql:/scripts:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        psql -h db -U postgres -d bodegas_atuel
        -c "ALTER ROLE bodegas_api PASSWORD '$${DB_API_PASSWORD}';"
        && psql -h db -U postgres -d bodegas_atuel
        -f /scripts/enable_price_audit.sql

  api:
    build:
      context: ./api
    depends_on:
      db:
        condition: service_healthy
      db-bootstrap:
        condition: service_completed_successfully
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: bodegas_atuel
      DB_USER: bodegas_api
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_SSLMODE: ${DB_SSLMODE:-prefer}
      DB_SSLROOTCERT: ${DB_SSLROOTCERT:-}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-10}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
    ports:
      - "${API_PORT:-8000}:8000"

  front:
    build:
      context: ./front
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    depends_on:
      api:
        condition: service_started
    ports:
      - "${FRONT_PORT:-8080}:80"

  db-test:
    image: postgres:15
    profiles: ["test"]
    environment:
      POSTGRES_USER: ${TEST_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-local_test_only_password}
      POSTGRES_DB: ${TEST_POSTGRES_DB:-bodegas_atuel_test}
    ports:
      - "${TEST_POSTGRES_PORT:-5433}:5432"
    volumes:
      - db_test_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${TEST_POSTGRES_USER:-postgres} -d ${TEST_POSTGRES_DB:-bodegas_atuel_test}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  db_data:
  db_test_data: